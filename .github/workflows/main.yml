- name: Run Database Migrations
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Load user environment paths
            [ -f ~/.bashrc ] && source ~/.bashrc
            [ -f ~/.bash_profile ] && source ~/.bash_profile

            # 2. Add common cPanel Node paths to PATH
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # 3. If you use cPanel Node.js Selector, activate it automatically:
            for env_act in ~/nodevenv/*/bin/activate; do
              [ -f "$env_act" ] && source "$env_act" && break
            done

            # 4. Navigate to your app directory and run migrations
            cd ~/public_html || cd ~/samstrusttech.com

            if command -v npx >/dev/null 2>&1; then
              npx prisma migrate deploy || npm run migrate --if-present
            else
              echo "Warning: npx still not found in PATH; skipping migration step."
            fi
